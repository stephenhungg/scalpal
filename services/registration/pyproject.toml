[project]
name = "scalpal-registration"
version = "0.1.0"
description = "Ephemeral local image-space body pose boundary for Quest registration"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mediapipe==0.10.35",
    "numpy>=2.2.6,<3",
    "Pillow>=12.1,<13",
]

[project.scripts]
scalpal-registration = "scalpal_registration.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scalpal_registration"]

[dependency-groups]
dev = ["pytest>=9.1.1,<10"]
