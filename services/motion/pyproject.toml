[project]
name = "scalpal-motion"
version = "0.1.0"
description = "Offline passthrough clip -> hand landmarks -> robot hand retargeting -> replay"
requires-python = ">=3.10,<3.13"
dependencies = [
    "dex-retargeting>=0.5.0",
    "mediapipe>=0.10.14,<0.11",
    "mujoco>=3.14.0",
    "numpy>=2.2.6",
    "opencv-python>=5.0.0.93",
    "torch>=2.14.1",
]

[project.scripts]
scalpal-motion = "scalpal_motion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scalpal_motion"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
