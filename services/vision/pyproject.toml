[project]
name = "scalpal-vision"
version = "0.1.0"
description = "Local open-vocabulary bounding-box detection for real camera images"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.2.6,<3",
    "Pillow>=11",
    "scipy>=1.14",
    "torch>=2.5",
    "transformers>=4.48,<5",
    "uvicorn>=0.32",
]

[project.scripts]
scalpal-vision = "scalpal_vision.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scalpal_vision"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.1.1,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
